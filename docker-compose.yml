services:
  mkvo:
    build:
      context: .
      dockerfile: Dockerfile
    image: mkvo:local
    container_name: mkvo
    ports:
      - "8886:8080"
    environment:
      MKVO_BIND: "0.0.0.0:8080"
      MKVO_MEDIA_ROOT: "/media"
      MKVO_SOURCE_ROOTS: "${MKVO_SOURCE_ROOTS:-downloads=/downloads}"
      MKVO_CONFIG_DIR: "/config"
      MKVO_UI_DIR: "/app/web"
      MKVO_AUTH_MODE: "${MKVO_AUTH_MODE:-disabled}"
      MKVO_AUTH_USERNAME: "${MKVO_AUTH_USERNAME:-}"
      MKVO_AUTH_PASSWORD: "${MKVO_AUTH_PASSWORD:-}"
      # Empty preserves legacy mode/credentials; set true or false to override.
      MKVO_AUTH_ENABLED: "${MKVO_AUTH_ENABLED:-}"
      MKVO_USERNAME: "${MKVO_USERNAME:-}"
      MKVO_PASSWORD: "${MKVO_PASSWORD:-}"
      MKVO_SECURE_COOKIES: "${MKVO_SECURE_COOKIES:-false}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-}"
    volumes:
      - ${MKVO_MEDIA_PATH:-./tmp/docker-media}:/media
      - ${MKVO_DOWNLOADS_PATH:-./tmp/docker-downloads}:/downloads
      - ${MKVO_CONFIG_PATH:-./tmp/docker-config}:/config
    restart: unless-stopped

