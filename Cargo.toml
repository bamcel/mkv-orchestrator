[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/server",
    "crates/mkvo-application",
    "crates/mkvo-contracts",
    "crates/mkvo-domain",
    "crates/mkvo-infra-media-servers",
    "crates/mkvo-infra-process",
    "crates/mkvo-infra-providers",
    "crates/mkvo-infra-sqlite",
    "crates/mkvo-infra-watch",
    "crates/mkvo-runtime",
    "tools/mkvo-contract-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["MKV Orchestrator contributors"]
repository = "https://github.com/mkv-orchestrator/mkv-orchestrator"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
