name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build MKVOrchestrator.sln --configuration Release
      - name: Run test harness
        run: dotnet run --project tests/MKVOrchestrator.Tests/MKVOrchestrator.Tests.csproj --configuration Release --no-build

  web:
    name: Build web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  rust-core:
    name: Build and test (Rust core/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated TypeScript contracts
        run: cargo run --locked --package mkvo-contract-gen -- --check
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint shared crates and server
        run: cargo clippy --workspace --all-targets --exclude mkvo-desktop -- -D warnings
      - name: Test shared crates and server
        run: cargo test --workspace --all-targets --exclude mkvo-desktop

  tauri-windows:
    name: Check Tauri desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check desktop host
        run: cargo check --package mkvo-desktop
      - name: Lint desktop host
        run: cargo clippy --package mkvo-desktop --all-targets -- -D warnings
      - name: Test desktop host
        run: cargo test --package mkvo-desktop --all-targets
