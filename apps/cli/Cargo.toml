[package]
name = "mkvo-cli"
description = "MKV Orchestrator command line host for scripted and headless use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mkvo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"
mkvo-contracts = { path = "../../crates/mkvo-contracts" }
mkvo-runtime = { path = "../../crates/mkvo-runtime" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
